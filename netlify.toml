# Tells Netlify how to build the site. These override the settings in the
# Netlify dashboard, so the build no longer depends on what was typed there.
[build]
  command = "npm run build"
  publish = ".next"

# Netlify's Next.js support. Without it the build output is uploaded as plain
# files and every page answers "Page not found".
[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"
