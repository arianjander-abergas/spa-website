# Supabase pauses free projects after about a week without activity.
# This makes one tiny read each day so the booking database stays awake.
#
# Setup: in the GitHub repository, Settings → Secrets and variables → Actions,
# add SUPABASE_URL and SUPABASE_ANON_KEY (same values as in .env.local).
name: Keep database awake

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl --fail --silent --show-error \
            "$SUPABASE_URL/rest/v1/settings?select=id" \
            -H "apikey: $SUPABASE_ANON_KEY" > /dev/null
